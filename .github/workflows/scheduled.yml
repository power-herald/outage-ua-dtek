name: Scheduled Pipeline
permissions:
  contents: write

on:
  # Allows manual trigger from the Actions tab and GitHub API
  workflow_dispatch:
    inputs:
      region:
        description: 'Optional: process only this region id (must match a key in REGION_SOURCES_JSON)'
        required: false
        type: string

jobs:
  # Job 1: Fetch and parse HTML for all regions
  fetch-and-parse:
    name: Fetch and parse HTML
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.set-matrix.outputs.regions }}
      has_changes: ${{ steps.check-changes.outputs.has_changes }}
    env:
      REGION_SOURCES_JSON: ${{ secrets.REGION_SOURCES_JSON }}
      REGION: ${{ github.event.inputs.region }}
      TARGET_BRANCH: main
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('**/package-lock.json') }}

      - name: Ensure Playwright Chromium is installed
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx --yes playwright install --with-deps chromium

      - name: Fetch HTML for each region (with Playwright fallback)
        shell: bash
        run: |
          set -euo pipefail
          echo "Started at $(date -u +"%Y-%m-%dT%H:%M:%SZ") (UTC)"

          # Basic validation
          if [ -z "${REGION_SOURCES_JSON:-}" ]; then
            echo "REGION_SOURCES_JSON is empty or not set. Ensure repository secret is configured." >&2
            exit 0
          fi

          mkdir -p outputs

          # If REGION is set — pass it to the script; otherwise fetch all
          if [ -n "${REGION:-}" ]; then
            echo "[INFO] Running Playwright fetcher for region='$REGION'"
            node scripts/fetch_regions_playwright.mjs "$REGION" || true
          else
            echo "[INFO] Running Playwright fetcher for all regions"
            node scripts/fetch_regions_playwright.mjs || true
          fi

          # Always exit 0 to not fail the pipeline on partial fetch issues
          exit 0

      - name: Parse DisconSchedule.fact into JSON per region (skip failures)
        shell: bash
        run: |
          set -euo pipefail
          echo "[INFO] Parsing outputs/*.html into data/*.json via Node batch parser"
          node scripts/batch_parse.mjs

      - name: Check for data changes
        id: check-changes
        shell: bash
        run: |
          set -euo pipefail
          changed_files=$(git status --porcelain data/ | grep '\.json$' | cut -c4- || true)
          
          if [ -z "$changed_files" ]; then
            echo "[INFO] No data changes detected."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "[INFO] Detected changes in: $changed_files"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Upload JSON data as artifact
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: json-data
          path: data/*.json
          retention-days: 1

      - name: Set matrix for rendering
        id: set-matrix
        env:
          REGION_SOURCES_JSON: ${{ secrets.REGION_SOURCES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${REGION:-}" ]; then
            # Manual trigger with specific region
            echo "regions=[\"${REGION}\"]" >> $GITHUB_OUTPUT
          else
            # Get all regions from secret
            regions=$(node scripts/list_regions.mjs)
            echo "regions=$regions" >> $GITHUB_OUTPUT
          fi

  # Job 3: Publish schedule data to a separate repository
  publish-data:
    name: Publish schedules
    runs-on: ubuntu-latest
    needs: [fetch-and-parse]
    if: needs.fetch-and-parse.outputs.has_changes == 'true' && github.ref_name == 'main'
    env:
      DATA_REPOSITORY: ${{ vars.DATA_REPOSITORY }}
      DATA_BRANCH: main
    steps:
      - name: Validate destination configuration
        shell: bash
        env:
          DATA_REPOSITORY_TOKEN: ${{ secrets.DATA_REPOSITORY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DATA_REPOSITORY:-}" ]; then
            echo "DATA_REPOSITORY variable must be set to owner/repository." >&2
            exit 1
          fi
          if [ -z "${DATA_REPOSITORY_TOKEN:-}" ]; then
            echo "DATA_REPOSITORY_TOKEN secret must provide write access to the destination repository." >&2
            exit 1
          fi

      - name: Checkout data repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DATA_REPOSITORY }}
          token: ${{ secrets.DATA_REPOSITORY_TOKEN }}
          ref: ${{ env.DATA_BRANCH }}
          path: data-repository
          fetch-depth: 0

      - name: Download JSON data artifact
        uses: actions/download-artifact@v4
        with:
          name: json-data
          path: data-files/

      - name: Arrange data folders
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          json_files=(data-files/*.json)
          if [ "${#json_files[@]}" -eq 0 ]; then
            echo "No JSON files found in the data artifact." >&2
            exit 1
          fi

          find data-repository -maxdepth 1 -type f -name '*.json' -delete
          rm -rf data-repository/data
          mkdir -p data-repository/data
          cp "${json_files[@]}" data-repository/data/

      - name: Commit and push schedules
        shell: bash
        run: |
          set -euo pipefail
          cd data-repository
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "[INFO] No schedule changes to publish."
            exit 0
          fi

          git commit -m "chore: update schedules — run #${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${DATA_BRANCH}"; then
              echo "[OK] Published schedules to ${DATA_REPOSITORY}:${DATA_BRANCH}"
              exit 0
            fi
            echo "[WARN] Push failed (attempt ${attempt}); rebasing on latest destination branch."
            git fetch origin "${DATA_BRANCH}"
            git rebase "origin/${DATA_BRANCH}"
          done

          echo "[ERROR] Failed to publish schedules after retries." >&2
          exit 1
